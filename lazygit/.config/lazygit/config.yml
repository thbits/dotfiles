gui:
  # Checking out a branch already checked out elsewhere jumps to its worktree silently
  skipSwitchWorktreeOnCheckoutWarning: true
  sidePanels:
    - [status]
    - [files, submodules]
    - [worktrees]
    - [branches, remotes, tags]
    - [commits, reflog]
    - [stash]

worktree:
  defaultPath: ../worktrees

customCommands:
  - key: "C"
    context: "files"
    description: "AI commit"
    prompts:
      - type: "menuFromCommand"
        title: "Pick a commit message"
        key: "Subject"
        command: 'sh -c "$HOME/.config/lazygit/ai_commit.sh"'
        filter: "^(.+)$"
        valueFormat: "{{ .group_1 }}"
        labelFormat: "{{ .group_1 }}"
    command: "git commit -m {{.Form.Subject | quote}}"
